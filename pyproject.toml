[project]
name = "ComfyArt"
description = "A free, open-source AI design canvas with DeepSeek Harness and VectorCraft MCP"
version = "1.3.0"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.12,<4", "SQLAlchemy>=2,<3", "pypdfium2>=4,<6", "Pillow>=10", "pillow-heif>=1.0,<2", "av>=12", "jsonschema>=4,<5", "numpy>=1.24,<3"]

[project.urls]
Repository = "https://github.com/chirsyaowen-cmd/ComfyArt"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
